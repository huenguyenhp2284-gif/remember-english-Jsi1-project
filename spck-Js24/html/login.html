<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
     <link rel="icon" type="image/png" sizes="16x16" href="/spck-Js24/imgandvd/favicon-16x16.png">
   
    <link rel="stylesheet" href="/spck-Js24/css/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
    <div class="nav-container">
        <div class="logo">
            <h2>Remember English</h2> 
        </div>
        <ul class="nav-links">
            <li><a href="./gioithieu.html" class="btn-nav-login">Giới thiệu</a></li>
        </ul>
    </div>
</nav>

    <div class="login-box">
        <div class="auth-tabs">
            <a href="./login.html" class="tab-link active">Đăng nhập</a>
            <a href="./dangki.html" class="tab-link">Đăng ký</a>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="Địa chỉ Email" required>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="Mật khẩu" required>
            </div>

            <button type="submit" class="btn-signin">Đăng nhập</button>

            <div class="form-help">
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Ghi nhớ!</label>
                </div>
                <a href="#" class="need-help">Cần trợ giúp?</a>
            </div>
            
            <div class="switch-auth" style="margin-top: 20px; text-align: center;">
                <span>Chưa có tài khoản? <a href="./dangki.html" style="color: #7a16df; text-decoration: none; font-weight: bold;">Đăng ký ngay</a></span>
            </div>
        </form>
    </div>
     
     
  
    <script  type="module" src="/spck-Js24/js/login.js"></script>
</body>
</html>
